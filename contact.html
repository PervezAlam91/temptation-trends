<!DOCTYPE html>
<html>
<head>
    <title>Contact Us - Temptation Trends</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            background: #111;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .header a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        /* Slider */
        .slider {
            margin-top: 60px;
            width: 100%;
            height: 60vh;
            position: relative;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            animation: slideShow 50s infinite;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Animation delays */
        .slide:nth-child(1) { animation-delay: 0s; }
        .slide:nth-child(2) { animation-delay: 5s; }
        .slide:nth-child(3) { animation-delay: 10s; }
        .slide:nth-child(4) { animation-delay: 15s; }
        .slide:nth-child(5) { animation-delay: 20s; }
        .slide:nth-child(6) { animation-delay: 25s; }
        .slide:nth-child(7) { animation-delay: 30s; }
        .slide:nth-child(8) { animation-delay: 35s; }
        .slide:nth-child(9) { animation-delay: 40s; }
        .slide:nth-child(10){ animation-delay: 45s; }

        @keyframes slideShow {
            0%   { opacity: 0; }
            5%   { opacity: 1; }
            10%  { opacity: 1; }
            15%  { opacity: 0; }
            100% { opacity: 0; }
        }

        /* Contact Section */
        .contact {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        .contacts {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: #000;
            color: white;
            padding: 20px;
            border-radius: 10px;
            width: 250px;
        }

        .card a {
            color: #00ffcc;
            text-decoration: none;
            font-size: 18px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            background: #111;
            color: white;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<!-- Header -->
<div class="header">
    <div><strong>Temptation Trends</strong></div>
    <div>
        <a href="#">Home</a>
        <a href="#">About Us</a>
        <a href="#">Contact</a>
    </div>
</div>

<!-- Slider -->
<div class="slider">
    <div class="slide"><img src="img1.jpg"></div>
    <div class="slide"><img src="img2.jpg"></div>
    <div class="slide"><img src="img3.jpg"></div>
    <div class="slide"><img src="img4.jpg"></div>
    <div class="slide"><img src="img5.jpg"></div>
    <div class="slide"><img src="img6.jpg"></div>
    <div class="slide"><img src="img7.jpg"></div>
    <div class="slide"><img src="img8.jpg"></div>
    <div class="slide"><img src="img9.jpg"></div>
    <div class="slide"><img src="img10.jpg"></div>
</div>

<!-- Contact Section -->
<div class="contact">
    <h1>Contact Us</h1>
    <p>Reach out to us anytime</p>

    <div class="contacts">
        <div class="card">
            <h2>Sharukh</h2>
            <p>Call / WhatsApp</p>
            <a href="tel:9058181206">9058181206</a>
        </div>

        <div class="card">
            <h2>Saurabh</h2>

        </div>

</div>

<!-- Footer -->
<div class="footer">
    © 2026 Temptation Trends
</div>

</body>
</html>
