<!DOCTYPE html>
<html>
<head>
    <title>Slider with Header</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Header Menu */
.header {
    background: #111;
    color: white;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            background: #111;
            color: white;
            margin-top: 40px;
        }

        .header a {
            color: white;
            margin-right: 20px;
            text-decoration: none;
        }

        /* Slider below header */
        .slider {
            margin-top: 60px; /* push below header */
            width: 100%;
            height: calc(100vh - 60px); /* full screen minus header */
            position: relative;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            animation: slideShow 50s infinite;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* IMPORTANT: shows full image */
            background: black;   /* optional: fills empty space */
        }

        .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center; /* keeps center visible */
}

        /* Animation delays */
        .slide:nth-child(1) { animation-delay: 0s; }
        .slide:nth-child(2) { animation-delay: 5s; }
        .slide:nth-child(3) { animation-delay: 10s; }
        .slide:nth-child(4) { animation-delay: 15s; }
        .slide:nth-child(5) { animation-delay: 20s; }
        .slide:nth-child(6) { animation-delay: 25s; }
        .slide:nth-child(7) { animation-delay: 30s; }
        .slide:nth-child(8) { animation-delay: 35s; }
        .slide:nth-child(9) { animation-delay: 40s; }
        .slide:nth-child(10){ animation-delay: 45s; }

        @keyframes slideShow {
            0%   { opacity: 0; }
            5%   { opacity: 1; }
            10%  { opacity: 1; }
            15%  { opacity: 0; }
            100% { opacity: 0; }
        }
    </style>
</head>

<body>

<!-- Header -->
<div class="header">
    <div><strong>Temptation Trends</strong></div>
    <div>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    © 2026 Temptation Trends | All Rights Reserved
</div>

<!-- Slider -->
<div class="slider">
    <div class="slide"><img src="img1.jpg"></div>
    <div class="slide"><img src="img2.jpg"></div>
    <div class="slide"><img src="img3.jpg"></div>
    <div class="slide"><img src="img4.jpg"></div>
    <div class="slide"><img src="img5.jpg"></div>
    <div class="slide"><img src="img6.jpg"></div>
    <div class="slide"><img src="img7.jpg"></div>
    <div class="slide"><img src="img8.jpg"></div>
    <div class="slide"><img src="img9.jpg"></div>
    <div class="slide"><img src="img10.jpg"></div>
</div>

</body>
</html>
